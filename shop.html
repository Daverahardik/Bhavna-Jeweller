    <!-- Loader -->

    <!-- Products Section -->
    <section id="products" class="py-4 mt-4">
        <div class="container py-4">
            <div class="row mb-4 align-items-center">
                <div class="col-md-4">
                    <h2 class="mb-0" style="font-family: 'Outfit'; font-weight: 700; color: var(--secondary-color);">All Products</h2>

                <div class="col-md-8 mt-3 mt-md-0 d-flex justify-content-between justify-content-md-end gap-2">

                        <input class="form-control me-2" type="search" placeholder="Search..." aria-label="Search" id="search-input">
                        <button class="btn btn-outline-secondary" type="submit"><i class="bi bi-search"></i></button>
                    </form>
                    <select class="form-select w-auto" id="category-filter">
                        <option value="All">All</option>
                        <!-- Categories will be populated dynamically -->
                    </select>
                </div>
            </div>
            
            <div id="no-products" class="text-center d-none py-5">
                <h4>No products found matching your criteria.</h4>
                <button class="btn btn-outline-primary mt-3" onclick="resetFilters()">Clear Filters</button>
            </div>

            <div class="row g-4" id="product-grid">
                <!-- Products will be injected here via JavaScript -->
            </div>
        </div>
    </section>
